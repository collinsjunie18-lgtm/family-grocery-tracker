<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Groceries</title>
  <meta name="description" content="Tap when something runs out. Everyone sees the list instantly.">
  <meta name="theme-color" content="#12261c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Groceries">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="back-btn" class="icon-btn" hidden aria-label="Back">←</button>
    <h1 id="title">Family Groceries</h1>
    <button id="notif-switch" class="notif-switch" role="switch" aria-checked="false" aria-label="Phone notifications">
      <span class="notif-icon" aria-hidden="true">🔔</span>
      <span class="track" aria-hidden="true"><span class="knob"></span></span>
      <span class="notif-state" id="notif-state">Off</span>
    </button>
  </header>

  <main id="app" aria-live="polite">
    <p class="loading">Loading…</p>
  </main>

  <div id="toast" role="status"></div>

  <div id="sheet-backdrop" hidden>
    <div id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
